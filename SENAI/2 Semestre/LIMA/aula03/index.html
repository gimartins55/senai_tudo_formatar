<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <center><h1>Formulario de Casdastro </h1></center>
    <p style="font-family: Times new roman; font-size: 20px;color: red;">Realize o cadastro e concorra a prêmios</p>

    <form>
        <label>Nome Completo</label>
        <input type = "text"
        placeholder="Insira seu nome"required/>
        <br><br>
        <label>Data de Nascimento</label>
        <input type="date"/>
        <br><br>
        <label>CPF</label>
        <input type = "number"/>
        <br><br>
        <label>Você nos indicaria?</label>
        <input type="number" min="1" mas="5"/>
        <br><br>
        <label>Email</label>
        <input type=""email"placeholder="Informe seu email"required/>
        <br><br>
        <label>cor favorita</label>
        <input type="color"/>
        <br><br>
        <label>Em qual volume você ouve musica (0 a 100)</label>
        <input id = "volume" type ="range" min="0" max="100" value="50" oninput="atualizarVolume(this.value)"/>
        <span id="valor-valume">50</span>
        <br><br>
        <fieldset>
            <legend>Gênero</legend>
            <input type="radio" name="genero" />
            <label>Masculino</label>
            <input type="radio" name="genero"/>
            <label>Feminino</label>
           
        </fieldset>
        <fieldset>
            <legend>Monte seu lanche! 🍔</legend>
           <input type="checkbox" id="salada" style="accent-color: rgb(34, 225, 34);"/>
            <label>Salada</label>
            <input type="checkbox" id="hamburguer" style="accent-color: rgba(67, 8, 8, 0.473);"/>
            <label>Hamburguer</label>
            <input type="checkbox" id="bacon" style="accent-color: rgba(249, 25, 0, 0.718);"/>
            <label>Bacon</label>
            <input type="checkbox" id="maionese" style="accent-color: rgb(191, 241, 177);"/>
            <label>Maionese caseira da Casa</label>
        </fieldset>
        <br><br>
        <label>Informaçãoes Adicionais</label>
        <textarea id = "info"></textarea>
        <br><br>
        <label>senha</label>
        <input type = "password"
        <br><br>
        <label>Informe a Cidade</label>
        <select id="cidade">
            <option>Jaguariúna</option>
            <option>Pedreira</option>
            <option>Amparo</option>
            <option>Arcadas</option>
            <option>Bragança Paulista</option>
            <option>Serra Negra</option>
        </select>

    </form>
    <script>
        function atualizarVolume (valor){
            document.getElementById('valor-volume').textContent = valor;
        }
    </script>

</body>
</html>
